<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="0.34" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#12314c"/><stop offset="0.55" stop-color="#0a1e31"/><stop offset="1" stop-color="#050e18"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff"/><stop offset="0.5" stop-color="#35c9f5"/><stop offset="1" stop-color="#2ce8c0"/>
    </linearGradient>
    <linearGradient id="fluid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe3ff"/><stop offset="1" stop-color="#2f9fe0"/>
    </linearGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- frasco: alça + corpo + fluido -->
  <g transform="translate(6,0)">
    <path d="M120 76 a20 20 0 0 1 40 0 v16" fill="none" stroke="#6fd2f0" stroke-width="13" stroke-linecap="round"/>
    <rect x="100" y="92" width="80" height="150" rx="34" fill="#0a2740" stroke="#6fd2f0" stroke-width="14"/>
    <path d="M104 168 h72 v40 a30 30 0 0 1-30 30 h-12 a30 30 0 0 1-30-30 z" fill="url(#fluid)" opacity=".92"/>
    <path d="M140 242 v34" stroke="#4a93c4" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- equipo: desce, curva e entrega na onda -->
  <path d="M146 276 v40 a54 54 0 0 0 54 54 h6" fill="none" stroke="#3f7fae" stroke-width="16" stroke-linecap="round"/>

  <!-- onda: o elemento dominante -->
  <g filter="url(#soft)">
    <path d="M206 370 C266 370 268 214 330 214 C392 214 386 392 442 392"
          fill="none" stroke="url(#wave)" stroke-width="34" stroke-linecap="round"/>
  </g>
  <circle cx="442" cy="392" r="42" fill="#2ce8c0" opacity=".2"/>
  <circle cx="442" cy="392" r="22" fill="#5ff0d2"/>
</svg>
